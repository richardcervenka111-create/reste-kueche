<title>Reste-Küche</title>

<style>
:root{--bg:#2b1d12;--card:#3a2819;--line:#573d29;--txt:#fbf4ec;--mut:#d6bfa8;--acc:#ffb347;--ok:#7ee2a8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.5 -apple-system,system-ui,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:24px;margin:8px 0 2px}.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.lang{float:right}.lang button{background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:4px 8px;font-size:13px;cursor:pointer}.lang button[aria-pressed="true"]{background:var(--acc);color:#321;border-color:var(--acc)}
h2{font-size:15px;margin:14px 0 6px;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:38px}
.chips button[aria-pressed="true"]{background:var(--ok);color:#062;border-color:var(--ok);font-weight:600}
.cnt{font-size:14px;color:var(--mut);margin:14px 0 6px}
.r{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.r summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:600}
.r summary::-webkit-details-marker{display:none}
.r .t{margin-left:auto;font-size:12px;color:var(--mut);white-space:nowrap}
.r .miss{font-size:12px;color:var(--acc);font-weight:400}
.r .b{padding:0 14px 14px;font-size:15px}.r .b p{margin:6px 0}.r .b .tip{border-left:3px solid var(--acc);padding-left:10px;color:var(--mut);margin-top:8px}
.r .ing{font-size:13px;color:var(--mut)}
.foot{color:var(--mut);font-size:13px;margin-top:26px;border-top:1px solid var(--line);padding-top:10px}.foot a{color:var(--acc)}
button.clr{background:none;border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;margin-left:8px}
</style>
</head>

 ["Fotzelschnitten","French toast, Bernese","Chlieb vo vajci",["brot","eier","milch"],["butter","zitrone"],15,"Brotscheiben in Milch-Ei-Mischung (2 Eier, 2 dl Milch, Prise Salz, etwas Zucker) tränken, in Butter goldbraun braten. Mit Zimtzucker oder Apfelmus.","Altes Brot saugt besser als frisches. Dicke Scheiben, Mittelhitze, Geduld."],
 ["Panzanella","Bread salad","Chlebový šalát",["brot","tomaten","oel"],["zwiebel","kraeuter","knoblauch"],15,"Brot in Würfeln im Ofen rösten, mit weichen Tomaten, roter Zwiebel, Olivenöl, Essig, Salz mischen, 20 Minuten ziehen lassen.","Die Tomaten müssen saftig sein, darum sind die weichen ideal."],
 ["Brotsuppe","Bread soup","Chlebová polievka",["brot","bouillon","zwiebel"],["hartkaese","eier","knoblauch"],25,"Zwiebel in Butter, Brotwürfel dazu, mit Bouillon aufgiessen, 15 Minuten köcheln, pürieren oder rustikal lassen. Käse darüber, unter dem Grill gratinieren.","Ein Ei am Schluss einrühren macht sie sämig."],
 ["Croûtons und Paniermehl","Croutons and breadcrumbs","Krutóny a strúhanka",["brot"],["oel","knoblauch","kraeuter"],10,"Würfel mit Öl, Salz, Knoblauch bei 180 °C 10 Minuten. Der Rest ganz trocken, im Mixer: Paniermehl, hält Monate.","Das ist die Grundregel: Brot wird nie weggeworfen, es wird kleiner."],
 ["Gebratener Reis","Fried rice","Smažená ryža",["reis","eier","zwiebel"],["gemuese","poulet","speck","knoblauch"],15,"Kalter Reis ist Pflicht. Zwiebel und Reste scharf anbraten, Reis dazu, Ei an den Rand stossen, stocken lassen, alles mischen, Sojasauce.","Reis vom Vortag hat die richtige Trockenheit; frischer wird Brei. Reste nur vom Vortag, danach weg."],
 ["Reis-Tätschli","Rice patties","Ryžové placky",["reis","eier","hartkaese"],["kraeuter","zwiebel","spinat"],20,"Reis, Ei, geriebener Käse, Salz, Kräuter mischen, Tätschli formen, in Öl beidseitig knusprig braten.","Wenn die Masse zerfällt: ein Löffel Mehl."],
 ["Milchreis","Rice pudding","Mliečna ryža",["reis","milch"],["butter","aepfel","zitrone"],15,"Gekochten Reis mit Milch, etwas Zucker, Vanille 10 Minuten köcheln bis cremig. Mit Apfelkompott.","Aus gekochtem Reis geht es doppelt so schnell wie aus rohem."],
 ["Pasta-Frittata","Pasta frittata","Cestovinová frittata",["pasta","eier","hartkaese"],["speck","kraeuter","zwiebel"],20,"4 Eier, Käse, Salz, Pfeffer verquirlen, mit den Teigwaren mischen, in der Pfanne in Öl langsam stocken lassen, wenden oder im Ofen fertig.","Der Klassiker aus Neapel, erfunden genau für Pasta-Reste."],

 ["Rösti aus gekochten Kartoffeln","Rösti","Rösti",["kart","butter"],["speck","zwiebel","hartkaese"],25,"Kartoffeln vom Vortag grob raffeln, salzen, in Butter bei mittlerer Hitze 10 Minuten pro Seite, nicht rühren.","Kartoffeln vom Vortag sind die Bedingung: frisch gekocht wird die Rösti Brei."],

 ["Zwiebelsuppe","Onion soup","Cibuľová polievka",["zwiebel","bouillon","butter"],["brot","hartkaese"],45,"Viele Zwiebeln in Butter 30 Minuten ganz langsam goldbraun, nie schwarz. Bouillon, 15 Minuten. Brotscheibe und Käse drauf, gratinieren.","Die Geduld beim Zwiebeln ist das ganze Rezept."],

 ["Rührei mit welkem Grün","Scrambled eggs with wilted greens","Praženica so zeleninou",["eier","spinat"],["butter","hartkaese","zwiebel"],10,"Spinat oder Blattgrün in Butter zusammenfallen lassen, Eier dazu, langsam rühren, früh vom Feuer.","Welke Blätter sind zum Kochen noch perfekt, nur zum Rohessen nicht mehr."],

 ["Joghurt-Dressing","Yoghurt dressing","Jogurtový dresing",["joghurt","zitrone"],["kraeuter","knoblauch","senf","oel"],5,"Joghurt, Zitronensaft, Salz, Pfeffer, Kräuter, etwas Öl. Hält 3 Tage im Kühlschrank.","Rettet auch den Salat, der schon müde ist: 20 Minuten Eiswasser, dann Dressing."],
 ["Käsesuppe","Cheese soup","Syrová polievka",["hartkaese","milch","brot"],["zwiebel","butter","bouillon"],20,"Zwiebel in Butter, Milch und etwas Bouillon, geriebene Käsereste einrühren bis geschmolzen, Brotwürfel dazu.","Alle Käseränder gehen rein, auch die harten Stücke: reiben oder mixen."],
 ["Käse-Wähe","Cheese tart","Syrový koláč",["hartkaese","eier","milch"],["mehl","butter","speck","zwiebel"],45,"Teig (oder gekauft), Käse darauf, Guss aus 2 Eiern, 2 dl Milch, Salz, Muskat. 30 Minuten bei 200 °C.","Das Berner Rezept gegen Käsereste seit Jahrhunderten."],

 ["Poulet-Salat","Chicken salad","Kurací šalát",["poulet","joghurt"],["senf","salat","aepfel","nuesse","zitrone"],10,"Poulet zerzupfen, mit Joghurt, Senf, Salz, Pfeffer, Apfelwürfeln und Nüssen mischen.","Rest-Poulet vom Vortag, gut gekühlt; am zweiten Tag essen."],

 ["Hackbraten-Tätschli aus Fleischrest","Meat patties","Mäsové placky",["fleisch","eier","brot"],["zwiebel","senf","kraeuter"],25,"Fleischreste fein hacken, mit eingeweichtem Brot, Ei, Zwiebel, Senf, Salz mischen, Tätschli braten.","Fleischreste nur bis 2 Tage nach dem Kochen und immer durchgebraten."],
 ["Gemüse-Curry","Vegetable curry","Zeleninové kari",["gemuese","zwiebel"],["huelsen","reis","joghurt","knoblauch"],30,"Zwiebel und Knoblauch anbraten, Curry-Pulver kurz mitrösten, Gemüsereste dazu, Wasser oder Kokosmilch, 15 Minuten. Mit Linsen sättigender.","Egal welches Gemüse, das Curry macht daraus eine Familie."],
 ["Gemüse-Bouillon aus Abschnitten","Vegetable stock from scraps","Zeleninový vývar z odrezkov",["gemuese"],["zwiebel","lauch","kraeuter"],40,"Schalen, Strünke, Lauchgrün, Kräuterstiele in einem Beutel im Gefrierer sammeln; wenn voll, 40 Minuten köcheln, abseihen.","Der Abfall-Beutel im Tiefkühler ist der beste Trick der Profiküche."],
 ["Minestrone","Minestrone","Minestrone",["gemuese","bouillon","zwiebel"],["huelsen","pasta","hartkaese","tomaten","kabis"],40,"Zwiebel, dann alles Gemüse in kleinen Würfeln, Bouillon, 25 Minuten, Bohnen und Pasta-Rest zum Schluss, Käse drüber.","Reihenfolge: Hartes zuerst, Weiches zuletzt."],
 ["Ofengemüse","Roast vegetables","Pečená zelenina",["gemuese","oel"],["kraeuter","knoblauch","kuerbis","rueebli"],35,"Alles in ähnlich grosse Stücke, Öl, Salz, Kräuter, 200 °C, 30 Minuten, einmal wenden.","Weiches Gemüse wird im Ofen süss statt matschig."],
 ["Tomatensauce auf Vorrat","Tomato sauce for the freezer","Paradajková omáčka do zásoby",["tomaten","zwiebel","oel"],["knoblauch","kraeuter"],40,"Zwiebel und Knoblauch in Öl, weiche Tomaten grob geschnitten dazu, Salz, 30 Minuten offen köcheln, pürieren. Einfrieren.","Je weicher die Tomaten, desto besser die Sauce."],
 ["Bananenbrot","Banana bread","Banánový chlieb",["bananen","eier","mehl"],["butter","nuesse","joghurt"],60,"3 braune Bananen zerdrücken, 2 Eier, 80 g Zucker, 80 g Butter, 200 g Mehl, 1 TL Natron, Prise Salz, Nüsse. 50 Minuten bei 175 °C.","Je brauner die Banane, desto süsser das Brot. Ganz schwarze sind die besten."],
 ["Bananen-Glace","Banana ice cream","Banánová zmrzlina",["bananen"],["joghurt","nuesse"],5,"Bananen in Stücken einfrieren, gefroren mixen bis cremig. Fertig.","Eine Zutat, eine Minute, und die Bananen sind gerettet."],
 ["Apfelkompott","Apple compote","Jablkový kompót",["aepfel"],["zitrone","butter"],20,"Äpfel geschält in Stücken mit wenig Wasser, Zitrone, etwas Zucker 15 Minuten köcheln. Kalt oder warm.","Runzlige Äpfel haben konzentrierteres Aroma als frische."],
 ["Apfel-Wähe","Apple tart","Jablkový koláč",["aepfel","eier","milch"],["mehl","butter","nuesse"],45,"Teig, Apfelschnitze darauf, Guss aus 2 Eiern, 2 dl Milch, 2 EL Zucker, gemahlene Nüsse auf den Boden. 35 Minuten bei 200 °C.","Die Nüsse auf dem Boden saugen den Saft, der Teig bleibt knusprig."],

 ["Linsen-Salat","Lentil salad","Šošovicový šalát",["huelsen","zwiebel","senf"],["rueebli","kraeuter","zitrone","oel"],10,"Dosenlinsen abspülen, mit Zwiebel, Senf-Vinaigrette, Rüebli-Würfeln, Kräutern mischen. Hält 3 Tage.","Die Dose im Schrank ist die Sicherheit für den Tag, an dem sonst nichts da ist."],
 ["Kürbissuppe","Pumpkin soup","Tekvicová polievka",["kuerbis","zwiebel","bouillon"],["rahm","kartroh","nuesse"],35,"Zwiebel anschwitzen, Kürbis in Würfeln, Bouillon, 20 Minuten, pürieren, Rahm. Kerne rösten und darüber.","Hokkaido mit Schale kochen, sie wird weich."],
 ["Fisch-Tätschli","Fish cakes","Rybie placky",["fisch","kart","eier"],["kraeuter","zitrone","senf"],20,"Fischreste zerpflücken, mit zerdrückten Kartoffeln, Ei, Kräutern, Zitrone mischen, formen, in Öl braten.","Fischreste nur vom Vortag, gut gekühlt, dann durchgebraten."],
